<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Room 1</title>
    <style>
      :root {
        --red: #e60012;
        --orange: #ff8a00;
        --ink: #161616;
        --muted: #5f6368;
        --line: #ececef;
        --surface: #ffffff;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #fff;
        color: var(--ink);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .display {
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: 190px minmax(360px, 1fr) minmax(520px, 2.45fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 0 34px;
        padding: 0 46px 22px 0;
        overflow: hidden;
        position: relative;
      }

      .brand-panel {
        grid-row: 1 / 4;
        min-height: 165px;
        padding: 30px 18px 24px;
        background: var(--orange);
        border-radius: 0 0 16px 0;
        color: white;
        text-align: center;
      }

      .brand-logo { display: block; width: 100%; height: auto; }

      .brand-panel p { margin: 14px 0 0; font-size: 0.74rem; font-weight: 700; }

      .heading {
        grid-column: 2;
        padding-top: 54px;
      }

      .heading h1 { margin: 0; font-size: clamp(2rem, 3.1vw, 3.2rem); }
      .heading p { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }

      .datetime {
        grid-column: 3;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 26px;
        padding-top: 28px;
        font-weight: 700;
      }

      .datetime .date, .datetime .time { font-size: 1.8rem; }
      .datetime .time { border-left: 2px solid #2d2d2d; padding-left: 26px; }

      .schedule-panel {
        grid-column: 2;
        align-self: start;
        margin-top: 66px;
        padding: 20px 22px;
        border: 1px solid #f0f0f0;
        border-radius: 20px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.05);
        background: rgba(255, 255, 255, 0.96);
      }

      .schedule-panel h2 { margin: 0 0 17px; font-size: 1.08rem; }
      .schedule-list { display: grid; gap: 12px; }
      .empty-schedule { color: var(--muted); margin: 12px 0; }

      .status-shell {
        grid-column: 3;
        grid-row: 2;
        margin-top: 24px;
        min-height: 0;
        height: calc(100% - 24px);
        padding: clamp(24px, 5vh, 80px) clamp(24px, 4vw, 64px) clamp(24px, 4vh, 68px);
        border: 1.5px solid rgba(230, 0, 18, 0.62);
        border-radius: 42px 42px 56px 42px;
        background: radial-gradient(circle at 52% 42%, #fff 0 31%, rgba(255, 246, 247, 0.92) 60%, rgba(255, 226, 229, 0.9) 100%);
        display: flex;
        justify-content: center;
        position: relative;
      }

      .status-shell.vacant {
        border-color: rgba(22, 154, 74, 0.62);
        background: radial-gradient(circle at 52% 42%, #fff 0 31%, rgba(244, 255, 247, 0.92) 60%, rgba(218, 247, 226, 0.9) 100%);
      }

      .status-card {
        --state-color: var(--red);
        width: min(100%, 760px);
        height: auto;
        margin: auto;
        padding: 56px 40px 42px;
        border-radius: 60px;
        background: rgba(255, 255, 255, 0.78);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .status-card > * { flex-shrink: 0; }

      .status-card.vacant { --state-color: #169a4a; }

      .status-word { margin: 0; color: var(--state-color); font-size: clamp(4rem, 7.6vw, 7.5rem); line-height: 1; }
      .status-rule { display: flex; align-items: center; width: 100%; margin: 46px 0 36px; color: var(--state-color); }
      .status-rule::before, .status-rule::after { content: ""; height: 2px; flex: 1; background: currentColor; }
      .status-rule span { width: 17px; height: 17px; border-radius: 50%; background: currentColor; margin: 0 7px; }
      .people-icon { width: 138px; color: var(--state-color); }
      .status-message { margin: 25px 0 16px; color: #565962; font-size: 1.25rem; }
      .meeting-meta { margin-top: 16px; color: #5e626b; line-height: 1.5; font-size: 0.98rem; }

      .footer {
        grid-column: 2 / 4;
        grid-row: 3;
        border-top: 3px solid var(--red);
        margin-top: 32px;
        padding-top: 13px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .footer strong { color: var(--red); margin-right: 10px; }

      @media (min-width: 681px) and (max-width: 1200px) {
        .display {
          grid-template-columns: 108px minmax(0, 0.92fr) minmax(0, 1.08fr);
          grid-template-rows: auto minmax(0, 1fr) auto;
          gap: 0 3.2%;
          padding: 0 4% 18px 0;
        }
        .brand-panel { padding: 22px 12px; }
        .brand-panel p { font-size: 0.64rem; }
        .heading { padding-top: 30px; }
        .heading h1 { font-size: clamp(1.7rem, 3.6vw, 2.6rem); }
        .heading p { margin: 4px 0 0; font-size: 0.95rem; }
        .datetime { justify-self: end; align-self: center; gap: 16px; padding-top: 14px; }
        .datetime .date, .datetime .time { font-size: clamp(1.05rem, 2.6vw, 1.5rem); }
        .datetime .time { padding-left: 16px; }
        .schedule-panel { margin-top: 26px; padding: 14px 16px; }
        .schedule-panel h2 { font-size: 0.98rem; margin-bottom: 12px; }
        .schedule-list { gap: 8px; }
        .status-shell { margin-top: 26px; height: calc(100% - 26px); padding: clamp(18px, 3vh, 34px); border-radius: 30px; }
        .status-card { padding: 26px 22px; border-radius: 34px; }
        .status-word { font-size: clamp(3rem, 6vw, 5.2rem); }
        .status-rule { margin: 24px 0 20px; }
        .people-icon { width: clamp(84px, 12vw, 120px); }
        .status-message { margin: 14px 0 10px; font-size: 1rem; }
        .meeting-meta { margin-top: 10px; font-size: 0.9rem; }
        .footer { margin-top: 20px; padding-top: 10px; }
      }

      @media (max-width: 680px) {
        .display { display: block; height: auto; min-height: 100vh; min-height: 100dvh; padding: 0 18px 20px; overflow: visible; }
        html, body { height: auto; overflow: auto; }
        .brand-panel { margin: 0 -18px; border-radius: 0 0 16px 16px; min-height: auto; padding: 18px; }
        .brand-panel p { display: none; }
        .heading { padding-top: 30px; }
        .datetime { justify-content: space-between; padding-top: 22px; }
        .datetime .date, .datetime .time { font-size: 1.4rem; }
        .schedule-panel { margin-top: 28px; }
        .status-shell { min-height: 490px; padding: 28px 16px; border-radius: 28px; }
        .status-card { min-height: 420px; padding: 42px 18px 30px; border-radius: 36px; }
        .status-rule { margin: 34px 0 26px; }
        .footer { margin-top: 24px; }
      }

      @media (max-height: 800px) and (min-width: 681px) {
        .status-shell { padding: 16px; }
        .status-card { padding: 22px 20px; border-radius: 38px; }
        .status-word { font-size: clamp(2.6rem, 7vw, 4rem); }
        .status-rule { margin: 14px 0 10px; }
        .people-icon { width: clamp(70px, 11vw, 92px); }
        .status-message { margin: 10px 0 8px; font-size: 1rem; }
        .meeting-meta { margin-top: 8px; font-size: 0.9rem; }
      }

      @media (max-height: 650px) and (min-width: 681px) {
        .heading { padding-top: 14px; }
        .heading p { margin: 2px 0 0; }
        .status-shell { margin-top: 12px; height: calc(100% - 12px); }
        .status-card { padding: 14px 16px; }
        .status-word { font-size: clamp(2.2rem, 5.5vw, 3.2rem); }
        .status-rule { margin: 10px 0 8px; }
        .people-icon { width: 62px; }
        .status-message { margin: 8px 0 6px; font-size: 0.95rem; }
        .meeting-meta { margin-top: 6px; font-size: 0.88rem; }
      }
    </style>
  </head>
  <body>
    <main class="display">
      <aside class="brand-panel" aria-label="Bandai Namco">
        <img class="brand-logo" src="bandai-namco-logo-transparent.png" alt="Bandai Namco" />
        <p>Fun for All into the Future</p>
      </aside>

      <header class="heading">
        <h1>Meeting Room 1</h1>
        <p>Connecting Fun and More</p>
      </header>

      <div class="datetime" aria-live="polite">
        <div class="date" id="todayLabel">May 23, 2024</div>
        <div class="time" id="currentTime">10:30 AM</div>
      </div>

      <section class="schedule-panel" aria-labelledby="scheduleHeading">
        <h2 id="scheduleHeading">Today's Schedule</h2>
        <div class="schedule-list" id="scheduleList">
          <p class="empty-schedule">No meetings scheduled</p>
        </div>
      </section>

      <section class="status-shell vacant" id="statusShell" aria-live="polite">
        <div class="status-card vacant" id="statusCard">
          <h2 class="status-word" id="statusWord">Vacant</h2>
          <div class="status-rule" aria-hidden="true"><span></span></div>
          <svg class="people-icon" viewBox="0 0 160 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="5">
            <circle cx="80" cy="27" r="20"></circle><circle cx="42" cy="42" r="15"></circle><circle cx="118" cy="42" r="15"></circle>
            <path d="M48 110v-20c0-19 14-34 32-34s32 15 32 34v20H48Z"></path><path d="M13 104V85c0-15 12-27 27-27 8 0 15 3 20 8M147 104V85c0-15-12-27-27-27-8 0-15 3-20 8"></path>
          </svg>
          <p class="status-message" id="statusMessage">This room is currently available</p>
          <div class="meeting-meta" id="focusMeta">Host:<br />Attendees:</div>
        </div>
      </section>

      <footer class="footer"><strong>BANDAI NAMCO</strong> Connecting Fun and More</footer>
    </main>

    <script>
      function updateDisplay() {
        const now = new Date();
        document.getElementById('currentTime').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        document.getElementById('todayLabel').textContent = now.toLocaleDateString([], { year: 'numeric', month: 'long', day: 'numeric' });
      }

      updateDisplay();
      setInterval(updateDisplay, 1000);
    </script>
  </body>
</html>
