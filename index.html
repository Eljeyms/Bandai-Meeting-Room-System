<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Room 3A</title>
    <style>
      :root {
        --red: #e60012;
        --orange: #ff8a00;
        --ink: #161616;
        --muted: #5f6368;
        --line: #ececef;
        --surface: #ffffff;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #fff;
        color: var(--ink);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .display {
        height: 100dvh;
        min-height: 0;
        display: grid;
        grid-template-columns: 190px minmax(360px, 1fr) minmax(520px, 2.45fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 0 34px;
        padding: 0 46px 22px 0;
        overflow: hidden;
        position: relative;
      }

      .brand-panel {
        grid-row: 1 / 4;
        min-height: 165px;
        padding: 30px 18px 24px;
        background: var(--orange);
        border-radius: 0 0 16px 0;
        color: white;
        text-align: center;
      }

      .brand-logo { display: block; width: 100%; height: auto; }

      .brand-panel p { margin: 14px 0 0; font-size: 0.74rem; font-weight: 700; }

      .heading {
        grid-column: 2;
        padding-top: 54px;
      }

      .heading h1 { margin: 0; font-size: clamp(2rem, 3.1vw, 3.2rem); letter-spacing: -0.05em; }
      .heading p { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }

      .datetime {
        grid-column: 3;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 26px;
        padding-top: 28px;
        font-weight: 700;
      }

      .datetime .date, .datetime .time { font-size: 1.8rem; }
      .datetime .time { border-left: 2px solid #2d2d2d; padding-left: 26px; letter-spacing: -0.04em; }

      .schedule-panel {
        grid-column: 2;
        align-self: start;
        margin-top: 66px;
        padding: 20px 22px;
        border: 1px solid #f0f0f0;
        border-radius: 20px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.05);
        background: rgba(255, 255, 255, 0.96);
      }

      .schedule-panel h2 { margin: 0 0 17px; font-size: 1.08rem; }
      .schedule-list { display: grid; gap: 12px; }

      .meeting {
        display: grid;
        grid-template-columns: 5px 46px 1fr 20px;
        align-items: center;
        min-height: 86px;
        overflow: hidden;
        border: 1px solid #ededf0;
        border-radius: 15px;
        background: #fbfbfc;
        width: 100%;
        padding: 0;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .meeting.active { box-shadow: 0 5px 13px rgba(230, 0, 18, 0.1); }
      .meeting.selected { border-color: var(--orange); box-shadow: 0 5px 13px rgba(255, 138, 0, 0.18); }
      .meeting:focus-visible { outline: 3px solid rgba(255, 138, 0, 0.42); outline-offset: 3px; }
      .meeting-bar { align-self: stretch; background: var(--orange); }
      .meeting-icon { color: var(--orange); font-size: 1.65rem; text-align: center; }
      .meeting-name { font-size: 1rem; font-weight: 800; }
      .meeting-time { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
      .chevron { color: #4d4d4d; font-size: 1.8rem; font-weight: 300; }
      .empty-schedule { color: var(--muted); margin: 12px 0; }

      .status-shell {
        grid-column: 3;
        grid-row: 2;
        margin-top: 24px;
        min-height: 0;
        height: calc(100% - 24px);
        padding: clamp(24px, 5vh, 80px) clamp(24px, 4vw, 64px) clamp(24px, 4vh, 68px);
        border: 1.5px solid rgba(230, 0, 18, 0.62);
        border-radius: 42px 42px 56px 42px;
        background: radial-gradient(circle at 52% 42%, #fff 0 31%, rgba(255, 246, 247, 0.92) 60%, rgba(255, 226, 229, 0.9) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .status-shell.vacant {
        border-color: rgba(22, 154, 74, 0.62);
        background: radial-gradient(circle at 52% 42%, #fff 0 31%, rgba(244, 255, 247, 0.92) 60%, rgba(218, 247, 226, 0.9) 100%);
      }

      .status-card {
        --state-color: var(--red);
        width: min(100%, 760px);
        min-height: 0;
        height: 100%;
        padding: 56px 40px 42px;
        border-radius: 60px;
        background: rgba(255, 255, 255, 0.78);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .status-card.vacant { --state-color: #169a4a; }

      .status-word { margin: 0; color: var(--state-color); font-size: clamp(4rem, 7.6vw, 7.5rem); letter-spacing: -0.08em; line-height: 0.9; }
      .status-rule { display: flex; align-items: center; width: 100%; margin: 46px 0 36px; color: var(--state-color); }
      .status-rule::before, .status-rule::after { content: ""; height: 2px; flex: 1; background: currentColor; }
      .status-rule span { width: 17px; height: 17px; border-radius: 50%; background: currentColor; margin: 0 7px; }
      .people-icon { width: 138px; color: var(--state-color); }
      .status-message { margin: 25px 0 16px; color: #565962; font-size: 1.25rem; }
      .meeting-focus { font-size: 1.45rem; font-weight: 800; }
      .meeting-focus-time { margin-top: 4px; color: #4d515a; font-size: 1.15rem; }
      .meeting-countdown { margin-top: 10px; color: var(--state-color); font-size: 1.15rem; font-weight: 800; }
      .meeting-attendance { margin-top: 8px; color: var(--ink); font-size: 1.08rem; font-weight: 800; }
      .meeting-meta { margin-top: 15px; color: #5e626b; line-height: 1.5; font-size: 0.98rem; }

      .footer {
        grid-column: 2 / 4;
        grid-row: 3;
        border-top: 3px solid var(--red);
        margin-top: 32px;
        padding-top: 13px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .footer strong { color: var(--red); margin-right: 10px; }

      @media (max-width: 1100px) {
        .display { grid-template-columns: 128px minmax(240px, 0.82fr) minmax(340px, 1.3fr); gap: 0 22px; padding: 0 24px 16px 0; }
        .heading { padding-top: 32px; }
        .heading h1 { font-size: 2.4rem; }
        .datetime { gap: 18px; padding-top: 22px; }
        .datetime .date, .datetime .time { font-size: 1.55rem; }
        .datetime .time { padding-left: 18px; }
        .schedule-panel { margin-top: 34px; padding: 16px; }
        .meeting { min-height: 76px; grid-template-columns: 5px 36px 1fr 18px; }
        .meeting-icon { font-size: 1.35rem; }
        .status-shell { margin-top: 18px; height: calc(100% - 18px); padding: 26px; border-radius: 30px 30px 40px 30px; }
        .status-card { padding: 30px 24px; border-radius: 38px; }
        .status-word { font-size: clamp(3.4rem, 7vw, 5.6rem); }
        .status-rule { margin: 28px 0 24px; }
        .people-icon { width: 110px; }
        .status-message { margin: 16px 0 12px; font-size: 1.05rem; }
        .meeting-focus { font-size: 1.2rem; }
        .meeting-focus-time, .meeting-countdown, .meeting-attendance { font-size: 1rem; }
        .meeting-meta { margin-top: 10px; }
        .footer { margin-top: 16px; padding-top: 9px; }
      }

      @media (max-width: 900px) and (orientation: portrait) {
        .display { grid-template-columns: 108px minmax(0, 1fr); grid-template-rows: 100px 210px minmax(0, 1fr) 40px; gap: 0 16px; padding-right: 16px; }
        .brand-panel { padding: 20px 12px; }
        .brand-panel p { display: none; }
        .heading { grid-column: 2; grid-row: 1; padding-top: 22px; }
        .heading h1 { font-size: 2rem; }
        .datetime { grid-column: 2; grid-row: 1; }
        .datetime .date, .datetime .time { font-size: 1.25rem; }
        .schedule-panel { grid-column: 2; grid-row: 2; align-self: stretch; margin-top: 0; padding: 12px; }
        .schedule-panel h2 { margin-bottom: 10px; }
        .schedule-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .meeting { min-height: 118px; grid-template-columns: 4px 1fr; grid-template-rows: 28px 1fr 28px; padding: 8px; }
        .meeting-bar { grid-row: 1 / 4; margin: -8px 0 -8px -8px; }
        .meeting-icon { display: none; }
        .meeting-name { font-size: 0.88rem; }
        .meeting-time { font-size: 0.76rem; }
        .chevron { display: none; }
        .status-shell { grid-column: 2; grid-row: 3; min-height: 0; margin-top: 12px; height: calc(100% - 12px); padding: 18px; }
        .status-card { padding: 22px 18px; }
        .status-word { font-size: clamp(3.2rem, 9vw, 4.8rem); }
        .status-rule { margin: 22px 0 18px; }
        .people-icon { width: 92px; }
        .footer { grid-column: 2; grid-row: 4; margin-top: 8px; padding-top: 7px; font-size: 0.78rem; }
      }

      @media (max-width: 680px) {
        .display { display: block; height: auto; min-height: 100dvh; padding: 0 18px 20px; overflow: visible; }
        html, body { height: auto; overflow: auto; }
        .brand-panel { margin: 0 -18px; border-radius: 0 0 16px 16px; min-height: auto; padding: 18px; }
        .brand-panel p { display: none; }
        .heading { padding-top: 30px; }
        .datetime { justify-content: space-between; padding-top: 22px; }
        .datetime .date, .datetime .time { font-size: 1.4rem; }
        .schedule-panel { margin-top: 28px; }
        .status-shell { min-height: 490px; padding: 28px 16px; border-radius: 28px; }
        .status-card { min-height: 420px; padding: 42px 18px 30px; border-radius: 36px; }
        .status-rule { margin: 34px 0 26px; }
        .footer { margin-top: 24px; }
      }
    </style>
  </head>
  <body>
    <main class="display">
      <aside class="brand-panel" aria-label="Bandai Namco">
        <img class="brand-logo" src="bandai-namco-logo-transparent.png" alt="Bandai Namco" />
        <p>Fun for All into the Future</p>
      </aside>

      <header class="heading">
        <h1>Meeting Room 3A</h1>
        <p>Connecting Fun and More</p>
      </header>

      <div class="datetime" aria-live="polite">
        <div class="date" id="todayLabel">May 23, 2024</div>
        <div class="time" id="currentTime">10:30 AM</div>
      </div>

      <section class="schedule-panel" aria-labelledby="scheduleHeading">
        <h2 id="scheduleHeading">Today's Schedule</h2>
        <div class="schedule-list" id="scheduleList"></div>
      </section>

      <section class="status-shell occupied" id="statusShell" aria-live="polite">
        <div class="status-card occupied" id="statusCard">
          <h2 class="status-word" id="statusWord">Occupied</h2>
          <div class="status-rule" aria-hidden="true"><span></span></div>
          <svg class="people-icon" viewBox="0 0 160 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="5">
            <circle cx="80" cy="27" r="20"></circle><circle cx="42" cy="42" r="15"></circle><circle cx="118" cy="42" r="15"></circle>
            <path d="M48 110v-20c0-19 14-34 32-34s32 15 32 34v20H48Z"></path><path d="M13 104V85c0-15 12-27 27-27 8 0 15 3 20 8M147 104V85c0-15-12-27-27-27-8 0-15 3-20 8"></path>
          </svg>
          <p class="status-message" id="statusMessage">This room is currently in use</p>
          <div class="meeting-focus" id="focusTitle">Design Review</div>
          <div class="meeting-focus-time" id="focusTime">10:00 AM – 11:00 AM</div>
          <div class="meeting-countdown" id="focusCountdown">Ends in 00:30:00</div>
          <div class="meeting-attendance" id="attendanceCount">5 people in room</div>
          <div class="meeting-meta" id="focusMeta">Host: A. Tanaka<br />Attendees: 5</div>
        </div>
      </section>

      <footer class="footer"><strong>BANDAI NAMCO</strong> Connecting Fun and More</footer>
    </main>

    <script>
      const meetings = [
        { start: 10 * 60, end: 11 * 60, title: 'Product Review', host: 'A. Tanaka', attendees: 5 },
        { start: 14 * 60, end: 15 * 60, title: 'Team Sync', host: 'J. Reyes', attendees: 6 },
        { start: 16 * 60, end: 17 * 60, title: 'Project Kickoff', host: 'M. Santos', attendees: 8 }
      ];
      let selectedMeetingIndex = null;

      const formatTime = minutes => {
        const hour = Math.floor(minutes / 60);
        const minute = minutes % 60;
        const suffix = hour >= 12 ? 'PM' : 'AM';
        const displayHour = hour % 12 || 12;
        return `${displayHour}:${minute.toString().padStart(2, '0')} ${suffix}`;
      };

      const formatDuration = totalSeconds => {
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return [hours, minutes, seconds].map(value => String(value).padStart(2, '0')).join(':');
      };

      function renderSchedule(currentMinutes) {
        const list = document.getElementById('scheduleList');
        list.innerHTML = '';
        meetings.forEach((meeting, index) => {
          const item = document.createElement('button');
          item.type = 'button';
          item.className = `meeting${currentMinutes >= meeting.start && currentMinutes < meeting.end ? ' active' : ''}${selectedMeetingIndex === index ? ' selected' : ''}`;
          item.setAttribute('aria-pressed', String(selectedMeetingIndex === index));
          item.setAttribute('aria-label', `View details for ${meeting.title}`);
          item.innerHTML = `<span class="meeting-bar"></span><span class="meeting-icon" aria-hidden="true">▣</span><div><div class="meeting-name"></div><div class="meeting-time"></div></div><span class="chevron" aria-hidden="true">›</span>`;
          item.querySelector('.meeting-name').textContent = meeting.title;
          item.querySelector('.meeting-time').textContent = `${formatTime(meeting.start)} – ${formatTime(meeting.end)}`;
          item.addEventListener('click', () => {
            selectedMeetingIndex = selectedMeetingIndex === index ? null : index;
            updateDisplay();
          });
          list.appendChild(item);
        });
      }

      function updateDisplay() {
        const now = new Date();
        const minutes = now.getHours() * 60 + now.getMinutes();
        const current = meetings.find(meeting => minutes >= meeting.start && minutes < meeting.end);
        const next = meetings.find(meeting => meeting.start > minutes);
        const selected = selectedMeetingIndex === null ? null : meetings[selectedMeetingIndex];
        const focus = selected || current || next;
        const countdown = document.getElementById('focusCountdown');
        const attendance = document.getElementById('attendanceCount');

        document.getElementById('currentTime').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        document.getElementById('todayLabel').textContent = now.toLocaleDateString([], { year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('statusWord').textContent = current ? 'Occupied' : 'Vacant';
        document.getElementById('statusMessage').textContent = current ? 'This room is currently in use' : 'This room is currently available';
        document.getElementById('statusShell').className = `status-shell ${current ? 'occupied' : 'vacant'}`;
        document.getElementById('statusCard').className = `status-card ${current ? 'occupied' : 'vacant'}`;

        if (focus) {
          document.getElementById('focusTitle').textContent = selected ? `Scheduled: ${focus.title}` : (current ? focus.title : `Next: ${focus.title}`);
          document.getElementById('focusTime').textContent = `${formatTime(focus.start)} – ${formatTime(focus.end)}`;
          document.getElementById('focusMeta').innerHTML = `Host: ${focus.host}<br />Attendees: ${focus.attendees}`;
          attendance.textContent = `${focus.attendees} ${focus.attendees === 1 ? 'person' : 'people'} in room`;
          if (current && focus === current) {
            const meetingEnd = new Date(now);
            meetingEnd.setHours(Math.floor(focus.end / 60), focus.end % 60, 0, 0);
            const secondsRemaining = Math.max(0, Math.floor((meetingEnd - now) / 1000));
            countdown.textContent = `Ends in ${formatDuration(secondsRemaining)}`;
          } else {
            countdown.textContent = `Duration: ${formatDuration((focus.end - focus.start) * 60)}`;
          }
        } else {
          document.getElementById('focusTitle').textContent = 'No more meetings today';
          document.getElementById('focusTime').textContent = '';
          countdown.textContent = '';
          attendance.textContent = '';
          document.getElementById('focusMeta').textContent = '';
        }

        renderSchedule(minutes);
      }

      updateDisplay();
      setInterval(updateDisplay, 1000);
    </script>
  </body>
</html>
