services:
  mongodb:
    image: mongo:8
    container_name: bandai-meeting-room-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - bandai_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bandai_mongodb_data:
